# Traefik アクセスログのローテーション設定

# 注意: Traefik はログの再オープン（SIGHUP/SIGUSR1 等）に対応していないため、 standard モードだと、
# Traefik が古い fd を握り続けて新ファイルに書かれずローテーションが破綻する。
# そのため copytruncate を使う（コピー後に元ファイルを truncate するので、開いた fd のまま同じパスへ書き続けられる）

# 参考: https://doc.traefik.io/traefik/observability/logs/

/opt/dc/traefik/logs/access.log {
    daily                   # 1日ごと
    rotate 14               # 14世代（約2週間）保持
    maxsize 100M            # 1日未満でも100MBを超えたらローテーション
    missingok               # ファイルがなければスキップ
    notifempty              # 空ならローテーションしない
    compress                # 古いログは gzip 圧縮
    delaycompress           # 直近の1世代は圧縮しない（copytruncate と併用必須）
    copytruncate            # 上記の理由により必須
}

