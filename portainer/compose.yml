# For main system
# $ docker compose --project-directory /opt/dc/portainer up -d --pull always portainer

# For sub system (Agent mode)
# $ docker compose --project-directory /opt/dc/portainer up -d --pull always portainer-agent

# For sub system (Edge Agent mode)
# $ docker compose --project-directory /opt/dc/portainer up -d --pull always portainer-edge-agent


# 環境変数 `DOCKER_GID` を `grep docker /etc/group` で確認して設定すること

# non-root では /var/lib/docker/volumes (root:root 0701) を list できないため、必要ならホスト側で ACL を付与
#   sudo setfacl -m u:1000:rx /var/lib/docker/volumes


x-common: &common
  restart: unless-stopped
  network_mode: bridge
  user: 1000:1000
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  portainer:
    <<: *common
    container_name: portainer
    hostname: portainer
    image: portainer/portainer-ee:alpine
    expose:
      - 8000
      - 9000
      - 9443
    ports:
      - 8000:8000/tcp  # Edge agent とトンネルを張るポート
      - 9443:9443/tcp  # Web UI のポート (HTTPS)
    group_add:
      - ${DOCKER_GID:?}
      - ${CERTS_GID:-200}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rw
      - ${REPO_PATH:-/opt/dc}/portainer/data:/data:rw
      - ${REPO_PATH:-/opt/dc}/traefik/certificates:/certificates:ro
    command:
      - --http-enabled
      - --sslcert
      - /certificates/certs/$DOMAIN.crt
      - --sslkey
      - /certificates/private/$DOMAIN.key
    environment:
      TZ: $TZ
      AGENT_SECRET: ${PORTAINER_AGENT_SECRET:?}
    labels:
      traefik.enable: true
      traefik.http.routers.pt.rule: Host(`pt.$DOMAIN`)
      traefik.http.routers.pt.entrypoints: https
      traefik.http.routers.pt.service: pt
      traefik.http.services.pt.loadbalancer.server.port: 9000
    healthcheck:
      test: 'wget -q -Y off -O - --no-check-certificate https://localhost:9443/api/system/status'
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s

  portainer-agent:
    <<: *common
    container_name: portainer-agent
    hostname: portainer-agent
    image: portainer/agent:alpine
    working_dir: /tmp
    entrypoint:
      - /app/agent
    ports:
      - 9001:9001/tcp
    group_add:
      - ${DOCKER_GID:?}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /data:size=64m,mode=1777
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rw
    environment:
      AGENT_SECRET: ${PORTAINER_AGENT_SECRET:?}
    healthcheck:
      # 標準 agent の 9001 は HTTPS (自己署名)、アクセス先がホスト名なのはコンテナの IP アドレスでリッスンされているため
      test: 'wget -q -Y off -O - --no-check-certificate https://portainer-agent:9001/ping'
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s

  portainer-edge-agent:
    <<: *common
    container_name: portainer-edge-agent
    hostname: portainer-edge-agent
    image: portainer/agent:alpine
    working_dir: /tmp
    entrypoint:
      - /app/agent
    group_add:
      - ${DOCKER_GID:?}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /data:size=64m,mode=1777
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rw
    environment:
      AGENT_SECRET: ${PORTAINER_AGENT_SECRET:?}
      EDGE: 1
      EDGE_ID: $PORTAINER_EDGE_ID
      EDGE_KEY: $PORTAINER_EDGE_KEY
    healthcheck:
      # edge agent の 9001 は HTTP (TLS 無効)、アクセス先がホスト名なのはコンテナの IP アドレスでリッスンされているため
      test: 'wget -q -Y off -O - http://portainer-edge-agent:9001/ping'
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s
