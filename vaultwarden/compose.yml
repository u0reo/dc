x-common: &common
  restart: unless-stopped
  user: 1000:1000
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  vaultwarden:
    <<: *common
    container_name: vaultwarden
    hostname: vaultwarden
    image: vaultwarden/server:alpine
    network_mode: bridge
    expose:
      - 8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /run/mysqld/mysqld.sock:/tmp/mysql.sock:ro
      - ${REPO_PATH:-/opt/dc}/vaultwarden/data:/data:rw
    environment:
      ROCKET_PORT: 8080  # 80 のままでは non-root で bind できないため 8080 へ変更
      DATABASE_URL: $DATABASE_URL
      DOMAIN: https://vw.$DOMAIN
      SMTP_HOST: $SMTP_HOST
      SMTP_FROM: no-reply@vw.$DOMAIN
      SMTP_PORT: 465
      SMTP_SECURITY: force_tls
      SMTP_USERNAME: $SMTP_USERNAME
      SMTP_PASSWORD: $SMTP_PASSWORD
    labels:
      traefik.enable: true
      # Vaultwarden 1.34+ は WebSocket (/notifications/hub) を同一ポートで提供
      traefik.http.routers.vw.rule: 'Host(`vw.$DOMAIN`)'
      traefik.http.routers.vw.entrypoints: https
      traefik.http.routers.vw.service: vw
      traefik.http.services.vw.loadbalancer.server.port: 8080
    healthcheck:
      test: '/healthcheck.sh'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s
