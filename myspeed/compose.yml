services:
  myspeed:
    container_name: myspeed
    hostname: myspeed
    image: germannewsmaker/myspeed:latest
    restart: unless-stopped
    network_mode: host # できるだけ速くするため、ブリッジさせない
    # interface を常に $TARGET_IF に設定
    entrypoint:
      - sh
      - -c
      - |
        IF="$${TARGET_IF:-eth0}"
        node -e "const d=require('/myspeed/node_modules/sqlite3').Database('/myspeed/data/storage.db');d.run(\"UPDATE config SET value='$$IF' WHERE key='interface' AND value!='$$IF'\",()=>d.close())" 2>/dev/null
        F=/myspeed/server/util/loadInterfaces.js
        grep -q "ONLY-IFACE-PATCHED-$$IF" "$$F" || sed -i "s|module\.exports\.interfaces = usableInterfaces;|if (usableInterfaces['$$IF']) { for (const k in usableInterfaces) if (k !== '$$IF') delete usableInterfaces[k]; } // ONLY-IFACE-PATCHED-$$IF\nmodule.exports.interfaces = usableInterfaces;|" "$$F"
        exec docker-entrypoint.sh "$$0" "$$@"
      - node
      - server
    expose:
      - 5216
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/dc/myspeed/data:/myspeed/data:rw
    environment:
      # 集計対象の interface を指定 (未指定なら eth0)
      TARGET_IF: "${TARGET_IF:-eth0}"
    labels:
      traefik.enable: true
      traefik.http.routers.myspeed.rule: Host(`myspeed.$DOMAIN`)
      traefik.http.routers.myspeed.entrypoints: https
      traefik.http.routers.myspeed.middlewares: authelia@docker
      traefik.http.routers.myspeed.service: myspeed
      traefik.http.services.myspeed.loadbalancer.server.port: 5216
    healthcheck:
      test: [ 'CMD-SHELL', 'wget --spider --server-response -q http://localhost:5216 2>&1 | awk "/^  HTTP/{print $2}"' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1s
