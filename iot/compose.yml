x-common: &common
  restart: unless-stopped
  user: 1000:1000
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  homeassistant:
    <<: *common
    container_name: homeassistant
    hostname: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    # Bluetooth アダプタ管理 (自動リカバリ) のため実効 capability が必要
    # (Docker は非 root ユーザーには cap_add を bounding (上限) しか付与せず、 effective (実効) には付与しない)
    user: 0:0
    read_only: true
    tmpfs:
      - /tmp
      # /run は s6 のスーパーバイザーツリー置き場 (tmpfs のデフォルトオーナーは root)
      - /run:mode=0755,exec
    network_mode: host  # ブロードキャスト対応
    expose:
      - 8123
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /run/mysqld/mysqld.sock:/tmp/mysql.sock:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - ${REPO_PATH:-/opt/dc}/iot/hass:/config:rw
    cap_add:
      # Bluetooth アダプタ管理 (habluetooth の mgmt ソケット操作)
      # カーネルが Bluetooth mgmt ソケットに対し CAP_NET_ADMIN と CAP_NET_RAW の 両方を要求
      - NET_ADMIN
      - NET_RAW
    labels:
      traefik.enable: true
      traefik.http.routers.hass.rule: Host(`hass.${DOMAIN:?}`)
      traefik.http.routers.hass.entrypoints: https
      traefik.http.routers.hass.service: hass
      traefik.http.services.hass.loadbalancer.server.port: 8123
    healthcheck:
      test: 'curl -fsSL http://localhost:8123'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - esphome

  esphome:
    <<: *common
    container_name: esphome
    hostname: esphome
    image: ghcr.io/esphome/esphome:latest
    mac_address: 02:00:00:00:60:52
    networks:
      macvlan:
        ipv4_address: ${MACVLAN_ESPHOME:?}
    expose:
      - 6052
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${REPO_PATH:-/opt/dc}/iot/esphome:/config:rw
      - ${REPO_PATH:-/opt/dc}/iot/esphome/.cache:/.cache:rw
      - ${REPO_PATH:-/opt/dc}/iot/esphome/.platformio:/.platformio:rw
      - ${REPO_PATH:-/opt/dc}/iot/esphome/hosts:/etc/hosts:ro
    cap_add:
      # ダッシュボード上の「Ping」機能で各デバイスのオンライン確認する際に ICMP パケットを送信するため
      - NET_RAW
    environment:
      ESPHOME_DASHBOARD_USE_PING: true
      ESPHOME_USERNAME: ${ESPHOME_USERNAME:?}
      ESPHOME_PASSWORD: ${ESPHOME_PASSWORD:?}
    labels:
      traefik.enable: true
      traefik.http.routers.esphome.rule: Host(`esphome.${DOMAIN:?}`)
      traefik.http.routers.esphome.entrypoints: https
      traefik.http.routers.esphome.service: esphome
      traefik.http.services.esphome.loadbalancer.server.port: 6052

  mosquitto:
    <<: *common
    container_name: mosquitto
    hostname: mosquitto
    image: eclipse-mosquitto:alpine
    user: 1883:1883  # mosquitto ユーザー
    mac_address: 02:00:00:00:18:83
    networks:
      macvlan:
        ipv4_address: ${MACVLAN_MOSQUITTO:?}
    ports:
      - 1883:1883/tcp # MQTT
      # - 9001:9001/tcp # MQTT via WebSocket
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${REPO_PATH:-/opt/dc}/iot/mosquitto:/mosquitto:rw
      - ${REPO_PATH:-/opt/dc}/iot/mosquitto/config:/mosquitto/config:ro
    healthcheck:
      test: mosquitto_pub -h localhost -p 1883 -t healthcheck/ping -m ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  node-red:
    <<: *common
    container_name: nodered
    hostname: nodered
    image: nodered/node-red:latest-minimal
    network_mode: bridge
    expose:
      - 1880
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${REPO_PATH:-/opt/dc}/iot/nodered:/data:rw
    depends_on:
      - mosquitto
    labels:
      traefik.enable: true
      traefik.http.routers.nodered.rule: Host(`nodered.${DOMAIN:?}`)
      traefik.http.routers.nodered.entrypoints: https
      traefik.http.routers.nodered.middlewares: authelia@docker

networks:
  # IoT 用 VLAN 上の macvlan
  # traefik (host モード) からの到達は host 側の macvlan shim 経由
  macvlan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:?}
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:?}
          gateway: ${MACVLAN_GATEWAY:?}
