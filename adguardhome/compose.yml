services:
  adguardhome:
    container_name: adguardhome
    hostname: adguardhome
    image: adguard/adguardhome:latest
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 853:853/tcp # DNS-over-TLS
      - 853:853/udp # DNS-over-QUIC
      - 8443:8443/tcp # HTTPS: Dashboard & DNS-over-HTTPS
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/certificates:/etc/certificates:ro
      - /opt/dc/adguardhome/configs:/opt/adguardhome/conf:rw
      - /opt/dc/adguardhome/data:/opt/adguardhome/work:rw
    labels:
      traefik.enable: true
      traefik.http.routers.dns.rule: Host(`dns.$DOMAIN`)
      traefik.http.routers.dns.entrypoints: https
      traefik.http.routers.dns.service: dns
      traefik.http.services.dns.loadbalancer.server.port: 80
      adguardhome-autoheal: true
    healthcheck:
      # DNS の実動作確認のみ、正しい DNS クエリ（A example.com）を UDP:53 に送信
      test:
        - 'CMD-SHELL'
        - |
          netstat -tln | grep -q ':53[[:space:]]' &&
          netstat -tln | grep -q ':80[[:space:]]' &&
          netstat -tln | grep -q ':853[[:space:]]' &&
          netstat -tln | grep -q ':8443[[:space:]]' &&
          netstat -uln | grep -qE '[:.]53[[:space:]]' &&
          netstat -uln | grep -qE '[:.]853[[:space:]]' &&
          nslookup example.localhost localhost >/dev/null 2>&1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # healthcheck が unhealthy になったコンテナを自動で再起動する
  autoheal:
    container_name: adguardhome-autoheal
    hostname: adguardhome-autoheal
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    network_mode: none
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # 監視対象はをラベルで絞り込み
      AUTOHEAL_CONTAINER_LABEL: adguardhome-autoheal
      # 監視間隔（秒）
      AUTOHEAL_INTERVAL: 30
      # 起動直後の猶予（秒）
      AUTOHEAL_START_PERIOD: 10
      # 監視対象が停止中でも再起動するかどうか
      AUTOHEAL_ONLY_MONITOR_RUNNING: true
    healthcheck:
      test: [ 'CMD-SHELL', 'grep -qa "autoheal" /proc/1/cmdline && test -S /var/run/docker.sock' ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s
