services:
  adguardhome:
    container_name: adguardhome
    hostname: adguardhome
    image: adguard/adguardhome:latest
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 853:853/tcp # DNS-over-TLS
      - 853:853/udp # DNS-over-QUIC
      - 8443:8443/tcp # HTTPS: Dashboard & DNS-over-HTTPS
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/certificates:/etc/certificates:ro
      - /opt/dc/adguardhome/configs:/opt/adguardhome/conf:rw
      - /opt/dc/adguardhome/data:/opt/adguardhome/work:rw
    labels:
      traefik.enable: true
      traefik.http.routers.dns.rule: Host(`dns.$DOMAIN`)
      traefik.http.routers.dns.entrypoints: https
      traefik.http.routers.dns.service: dns
      traefik.http.services.dns.loadbalancer.server.port: 80
    healthcheck:
      # - UDP:53/853 `nc -zvu` はエラーログのもととなったため、廃止
      # - UDP:53 は実際の DNS クエリ（A example.com）を送って応答を確認
      # - TCP は nc で接続確認のみ（853/8443 の TLS ハンドシェイクは行わない）
      # - UDP:853 (QUIC) は検証手段がないためチェックしない
      test:
        - 'CMD-SHELL'
        - |
          nc -zv localhost 53 &&
          # nc -zvu localhost 53 &&
          nc -zv localhost 80 &&
          # nc -zv  localhost 853 &&
          # nc -zvu localhost 853 &&
          nc -zv localhost 8443 &&
          printf '\xaa\xbb\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x07example\x03com\x00\x00\x01\x00\x01' \
            | nc -w 2 -u localhost 53 | grep -q example
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
